<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 442" width="860" height="442" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><text x="30" y="30" font-size="17" fill="#2f3635" text-anchor="start" font-weight="700" opacity="1">LED &#8212; which leg is which</text><text x="830" y="30" font-size="12.5" fill="#2f3635" text-anchor="end" font-weight="400" opacity="0.6">5 mm shown; 3 mm is identical apart from size</text><path d="M356 56 V300" stroke="#2f3635" stroke-width="1" opacity=".22"/><path d="M576 56 V300" stroke="#2f3635" stroke-width="1" opacity=".22"/><text x="30" y="74" font-size="11.5" fill="#2f3635" font-weight="700" letter-spacing="1.6" opacity=".55">THE PART, FROM THE SIDE</text><text x="384" y="74" font-size="11.5" fill="#2f3635" font-weight="700" letter-spacing="1.6" opacity=".55">FROM ABOVE</text><text x="600" y="74" font-size="11.5" fill="#2f3635" font-weight="700" letter-spacing="1.6" opacity=".55">FORWARD VOLTAGE</text><path d="M118 152 V126 a22 22 0 0 1 44 0 V152 Z" fill="#E8523F"/><path d="M112 152 h56 v11 h-56 z" fill="#C4402F"/><path d="M168 152 V163" stroke="#FF6347" stroke-width="3"/><path d="M130 163 V292" stroke="#2f3635" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M150 163 V244" stroke="#2f3635" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M131 116 a7 7 0 0 1 6 -6" stroke="#fff" stroke-width="2.2" fill="none" opacity=".65" stroke-linecap="round"/><path d="M126 286 H86" stroke="#FF6347" stroke-width="1.3" fill="none" opacity=".85"/><text x="82" y="282" font-size="14" fill="#2f3635" text-anchor="end" font-weight="700" opacity="1">anode</text><text x="82" y="299" font-size="12.5" fill="#2f3635" text-anchor="end" font-weight="400" opacity="0.65">long leg &#183; +</text><path d="M154 238 H196" stroke="#FF6347" stroke-width="1.3" fill="none" opacity=".85"/><text x="200" y="234" font-size="14" fill="#2f3635" text-anchor="start" font-weight="700" opacity="1">cathode</text><text x="200" y="251" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.65">short leg &#183; &#8722;</text><path d="M172 158 H210" stroke="#FF6347" stroke-width="1.3" fill="none" opacity=".85"/><text x="214" y="162" font-size="12.5" fill="#FF6347" text-anchor="start" font-weight="600" opacity="1">flat on the rim</text><path d="M483 124.7 A40 40 0 1 0 483 175.3 Z" fill="#F0EEE8" stroke="#2f3635" stroke-width="2"/><path d="M483 124.7 V175.3" stroke="#FF6347" stroke-width="3.5"/><circle cx="439" cy="150" r="5" fill="#2f3635"/><circle cx="463" cy="150" r="5" fill="#2f3635"/><text x="439" y="184" font-size="15" fill="#2f3635" text-anchor="middle" font-weight="700" opacity="1">+</text><text x="463" y="184" font-size="15" fill="#2f3635" text-anchor="middle" font-weight="700" opacity="1">&#8722;</text><path d="M489 150 H517" stroke="#FF6347" stroke-width="1.3" fill="none" opacity=".85"/><text x="523" y="155" font-size="12.5" fill="#FF6347" text-anchor="start" font-weight="600" opacity="1">flat</text><text x="384" y="236" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">The flat marks the cathode.</text><text x="384" y="254" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">It survives the legs being</text><text x="384" y="272" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">trimmed; leg length does not.</text><text x="600" y="108" font-size="13.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="1">red, yellow, green</text><text x="830" y="108" font-size="13.5" fill="#2f3635" text-anchor="end" font-weight="700" opacity="1">&#8776; 2.0 V</text><path d="M600 119 H830" stroke="#2f3635" stroke-width="1" opacity=".2"/><text x="600" y="142" font-size="13.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="1">blue, white, UV</text><text x="830" y="142" font-size="13.5" fill="#2f3635" text-anchor="end" font-weight="700" opacity="1">&#8776; 3.2 V</text><path d="M600 153 H830" stroke="#2f3635" stroke-width="1" opacity=".2"/><text x="600" y="176" font-size="13.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="1">absolute maximum</text><text x="830" y="176" font-size="13.5" fill="#2f3635" text-anchor="end" font-weight="700" opacity="1">20 mA</text><path d="M600 187 H830" stroke="#2f3635" stroke-width="1" opacity=".2"/><text x="600" y="210" font-size="13.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="1">comfortable</text><text x="830" y="210" font-size="13.5" fill="#2f3635" text-anchor="end" font-weight="700" opacity="1">5&#8211;15 mA</text><path d="M600 221 H830" stroke="#2f3635" stroke-width="1" opacity=".2"/><text x="600" y="262" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">Forward voltage barely moves with current,</text><text x="600" y="280" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">which is why an LED cannot limit itself.</text><path d="M30 322 H830" stroke="#2f3635" stroke-width="1" opacity=".22"/><text x="30" y="350" font-size="11.5" fill="#2f3635" font-weight="700" letter-spacing="1.6" opacity=".55">ALWAYS IN SERIES WITH A RESISTOR</text><path d="M60 396 H150 M210 396 H286 M320 396 H392" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><rect x="150" y="382" width="60" height="28" fill="#F0EEE8" stroke="#2f3635" stroke-width="2"/><path d="M286 378 V414 L318 396 Z" fill="#F0EEE8" stroke="#2f3635" stroke-width="2" stroke-linejoin="round"/><path d="M320 378 V414" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><path d="M392 396 V412 M376 412 H408 M382 418 H402 M388 424 H396" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><text x="52" y="401" font-size="14" fill="#2f3635" text-anchor="end" font-weight="700" opacity="1">+V</text><text x="180" y="374" font-size="14" fill="#2f3635" text-anchor="middle" font-weight="700" opacity="1">R</text><text x="303" y="430" font-size="12.5" fill="#2f3635" text-anchor="middle" font-weight="400" opacity="0.7">LED</text><text x="452" y="390" font-size="14" fill="#2f3635" text-anchor="start" font-weight="600" opacity="1">R = (supply &#8722; forward voltage) &#247; the current you want</text><text x="452" y="412" font-size="13" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.72">9 V red LED at 15 mA:  (9 &#8722; 2) &#247; 0.015 = 470 &#937;</text></svg>