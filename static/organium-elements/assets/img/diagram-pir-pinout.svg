<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 404" width="860" height="404" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><text x="30" y="30" font-size="17" fill="#2f3635" text-anchor="start" font-weight="700" opacity="1">PIR motion sensor (HC-SR501) &#8212; pinout</text><text x="830" y="30" font-size="12.5" fill="#2f3635" text-anchor="end" font-weight="400" opacity="0.6">pin order varies between modules: read the silkscreen</text><path d="M392 56 V330" stroke="#2f3635" stroke-width="1" opacity=".22"/><text x="30" y="74" font-size="11.5" fill="#2f3635" font-weight="700" letter-spacing="1.6" opacity=".55">FRONT</text><text x="420" y="74" font-size="11.5" fill="#2f3635" font-weight="700" letter-spacing="1.6" opacity=".55">BACK</text><rect x="96" y="96" width="200" height="200" rx="5" fill="#2F7D55"/><circle cx="196" cy="196" r="76" fill="#F4F1EC" stroke="#D6D2CA" stroke-width="2"/><path d="M158 158 a54 54 0 0 1 38 -22" stroke="#fff" stroke-width="6" fill="none" opacity=".65" stroke-linecap="round"/><text x="196" y="330" font-size="12.5" fill="#2f3635" text-anchor="middle" font-weight="400" opacity="0.7">A fresnel lens splits the view into zones.</text><text x="196" y="348" font-size="12.5" fill="#2f3635" text-anchor="middle" font-weight="400" opacity="0.7">Movement between zones is what it detects &#8212;</text><text x="196" y="366" font-size="12.5" fill="#2f3635" text-anchor="middle" font-weight="400" opacity="0.7">a person standing still disappears.</text><rect x="430" y="96" width="290" height="180" rx="5" fill="#2F7D55"/><rect x="452" y="124" width="44" height="44" rx="3" fill="#D98C2B"/><circle cx="474" cy="146" r="14" fill="#CBC8C0" stroke="#9A968C"/><path d="M466 146 H482" stroke="#5A5750" stroke-width="3.5" stroke-linecap="round"/><text x="508" y="151" font-size="13.5" fill="#EAF3ED" text-anchor="start" font-weight="600" opacity="1">sensitivity</text><rect x="452" y="194" width="44" height="44" rx="3" fill="#D98C2B"/><circle cx="474" cy="216" r="14" fill="#CBC8C0" stroke="#9A968C"/><path d="M466 216 H482" stroke="#5A5750" stroke-width="3.5" stroke-linecap="round"/><text x="508" y="221" font-size="13.5" fill="#EAF3ED" text-anchor="start" font-weight="600" opacity="1">time delay</text><rect x="616" y="174" width="12" height="12" rx="1.5" fill="#D9B24A" stroke="#A8862F"/><rect x="646" y="174" width="12" height="12" rx="1.5" fill="#D9B24A" stroke="#A8862F"/><rect x="676" y="174" width="12" height="12" rx="1.5" fill="#D9B24A" stroke="#A8862F"/><rect x="612" y="166" width="50" height="28" rx="2.5" fill="#22222A"/><text x="622" y="158" font-size="14" fill="#EAF3ED" text-anchor="middle" font-weight="700" opacity="1">H</text><text x="682" y="158" font-size="14" fill="#EAF3ED" text-anchor="middle" font-weight="700" opacity="1">L</text><text x="652" y="218" font-size="12" fill="#EAF3ED" text-anchor="middle" font-weight="600" opacity="0.85">retrigger jumper</text><rect x="454" y="276" width="16" height="24" rx="2" fill="#D9B24A" stroke="#A8862F"/><rect x="520" y="276" width="16" height="24" rx="2" fill="#D9B24A" stroke="#A8862F"/><rect x="586" y="276" width="16" height="24" rx="2" fill="#D9B24A" stroke="#A8862F"/><text x="462" y="322" font-size="13.5" fill="#2f3635" text-anchor="middle" font-weight="700" opacity="1">VCC</text><text x="528" y="322" font-size="13.5" fill="#FF6347" text-anchor="middle" font-weight="700" opacity="1">OUT</text><text x="594" y="322" font-size="13.5" fill="#2f3635" text-anchor="middle" font-weight="700" opacity="1">GND</text><text x="462" y="340" font-size="11.5" fill="#2f3635" text-anchor="middle" font-weight="400" opacity="0.65">5&#8211;12 V in</text><text x="528" y="340" font-size="11.5" fill="#2f3635" text-anchor="middle" font-weight="400" opacity="0.65">3.3 V high</text><text x="650" y="288" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">three pins, 0.1 in apart</text><text x="650" y="306" font-size="12.5" fill="#FF6347" text-anchor="start" font-weight="600" opacity="1">OUT drives a small LED</text><text x="650" y="324" font-size="12.5" fill="#FF6347" text-anchor="start" font-weight="600" opacity="1">directly &#8212; no transistor</text><text x="420" y="372" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">Warm-up is about 30 s after power-up, and it fires at</text><text x="420" y="390" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">nothing throughout. That is normal, not a fault.</text></svg>