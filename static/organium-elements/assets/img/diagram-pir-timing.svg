<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 414" width="860" height="414" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><text x="30" y="30" font-size="17" fill="#2f3635" text-anchor="start" font-weight="700" opacity="1">PIR retrigger jumper &#8212; what H and L actually do</text><text x="830" y="30" font-size="12.5" fill="#2f3635" text-anchor="end" font-weight="400" opacity="0.6">Tx = the delay set by the time-delay pot</text><path d="M90 140 H790" stroke="#2f3635" stroke-width="1" opacity=".25"/><text x="78" y="136" font-size="13" fill="#2f3635" text-anchor="end" font-weight="700" opacity="1">movement</text><path d="M120 140 V106" stroke="#2f3635" stroke-width="2.6" stroke-linecap="round"/><circle cx="120" cy="102" r="4" fill="#2f3635"/><text x="120" y="88" font-size="12" fill="#2f3635" text-anchor="middle" font-weight="700" opacity="0.7">1</text><path d="M200 140 V106" stroke="#2f3635" stroke-width="2.6" stroke-linecap="round"/><circle cx="200" cy="102" r="4" fill="#2f3635"/><text x="200" y="88" font-size="12" fill="#2f3635" text-anchor="middle" font-weight="700" opacity="0.7">2</text><path d="M250 140 V106" stroke="#2f3635" stroke-width="2.6" stroke-linecap="round"/><circle cx="250" cy="102" r="4" fill="#2f3635"/><text x="250" y="88" font-size="12" fill="#2f3635" text-anchor="middle" font-weight="700" opacity="0.7">3</text><path d="M480 140 V106" stroke="#2f3635" stroke-width="2.6" stroke-linecap="round"/><circle cx="480" cy="102" r="4" fill="#2f3635"/><text x="480" y="88" font-size="12" fill="#2f3635" text-anchor="middle" font-weight="700" opacity="0.7">4</text><text x="90" y="190" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.75">H &#8212; each new movement restarts the timer, so it stays high while anything keeps moving</text><path d="M90 250 H790" stroke="#2f3635" stroke-width="1" opacity=".25"/><text x="78" y="238" font-size="13" fill="#2f3635" text-anchor="end" font-weight="700" opacity="1">OUT</text><text x="78" y="256" font-size="11.5" fill="#2f3635" text-anchor="end" font-weight="400" opacity="0.6">jumper on H</text><path d="M90 250 H120 V208 H390 V250 H480 V208 H620 V250 H790" stroke="#FF6347" stroke-width="2.6" fill="none" stroke-linejoin="round"/><text x="90" y="282" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.75">L &#8212; one burst of Tx, then low. Movements 2 and 3 are ignored.</text><path d="M90 340 H790" stroke="#2f3635" stroke-width="1" opacity=".25"/><text x="78" y="328" font-size="13" fill="#2f3635" text-anchor="end" font-weight="700" opacity="1">OUT</text><text x="78" y="346" font-size="11.5" fill="#2f3635" text-anchor="end" font-weight="400" opacity="0.6">jumper on L</text><path d="M90 340 H120 V298 H260 V340 H480 V298 H620 V340 H790" stroke="#FF6347" stroke-width="2.6" fill="none" stroke-linejoin="round"/><path d="M120 358 V374 M260 358 V374" stroke="#2f3635" stroke-width="1.2" opacity=".55"/><path d="M120 366 H260" stroke="#2f3635" stroke-width="1.2" opacity=".55"/><text x="190.0" y="362" font-size="12" fill="#2f3635" text-anchor="middle" font-weight="700" opacity="0.75">Tx</text><text x="90" y="400" font-size="13" fill="#FF6347" text-anchor="start" font-weight="600" opacity="1">For a light that should stay on while somebody is in the room, use H.</text></svg>