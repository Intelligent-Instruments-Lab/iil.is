<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><text x="30" y="30" font-size="17" fill="#2f3635" text-anchor="start" font-weight="700" opacity="1">Tactile button &#8212; four legs, two terminals</text><text x="830" y="30" font-size="12.5" fill="#2f3635" text-anchor="end" font-weight="400" opacity="0.6">momentary: closed only while pressed</text><path d="M356 56 V300" stroke="#2f3635" stroke-width="1" opacity=".22"/><path d="M576 56 V300" stroke="#2f3635" stroke-width="1" opacity=".22"/><text x="30" y="74" font-size="11.5" fill="#2f3635" font-weight="700" letter-spacing="1.6" opacity=".55">FROM ABOVE</text><text x="384" y="74" font-size="11.5" fill="#2f3635" font-weight="700" letter-spacing="1.6" opacity=".55">WHAT IS JOINED INSIDE</text><text x="600" y="74" font-size="11.5" fill="#2f3635" font-weight="700" letter-spacing="1.6" opacity=".55">WITH A MICROCONTROLLER</text><rect x="128" y="108" width="120" height="120" rx="4" fill="#22222A"/><circle cx="188" cy="168" r="30" fill="#CBC8C0" stroke="#8E8B84" stroke-width="1.5"/><path d="M128 134 H90 M248 134 H286" stroke="#9A968C" stroke-width="4" stroke-linecap="round"/><path d="M128 202 H90 M248 202 H286" stroke="#9A968C" stroke-width="4" stroke-linecap="round"/><path d="M86 134 H74 V202 H86" stroke="#FF6347" stroke-width="2.4" fill="none" opacity=".85"/><path d="M290 134 H302 V202 H290" stroke="#FF6347" stroke-width="2.4" fill="none" opacity=".85"/><text x="70" y="130" font-size="12.5" fill="#FF6347" text-anchor="end" font-weight="700" opacity="1">joined</text><text x="70" y="147" font-size="12.5" fill="#FF6347" text-anchor="end" font-weight="700" opacity="1">inside</text><text x="306" y="130" font-size="12.5" fill="#FF6347" text-anchor="start" font-weight="700" opacity="1">joined</text><text x="306" y="147" font-size="12.5" fill="#FF6347" text-anchor="start" font-weight="700" opacity="1">inside</text><text x="188" y="262" font-size="12.5" fill="#2f3635" text-anchor="middle" font-weight="400" opacity="0.7">&#8776; 0.2 in along &#183; 0.3 in across</text><text x="188" y="282" font-size="12.5" fill="#2f3635" text-anchor="middle" font-weight="400" opacity="0.7">so it straddles a breadboard channel</text><text x="188" y="302" font-size="12.5" fill="#2f3635" text-anchor="middle" font-weight="400" opacity="0.7">The 12 mm version is the same inside, twice the size.</text><path d="M392 130 H430 M392 200 H430 M430 130 V200" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><path d="M540 130 H502 M540 200 H502 M502 130 V200" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><circle cx="430" cy="165" r="4" fill="#2f3635"/><circle cx="502" cy="165" r="4" fill="#2f3635"/><path d="M430 165 H444 M488 165 H502" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><path d="M440 148 H492" stroke="#FF6347" stroke-width="2.6" stroke-linecap="round"/><path d="M466 148 V128 M450 128 H482" stroke="#FF6347" stroke-width="2.6" stroke-linecap="round"/><text x="466" y="116" font-size="12.5" fill="#FF6347" text-anchor="middle" font-weight="700" opacity="1">press</text><text x="384" y="244" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">The contact is between the two pairs, never</text><text x="384" y="262" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">within one. Wire across the body, not along it.</text><text x="384" y="284" font-size="12.5" fill="#FF6347" text-anchor="start" font-weight="600" opacity="1">Always on? Turn it a quarter turn.</text><path d="M640 120 V150" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><text x="640" y="112" font-size="12.5" fill="#2f3635" text-anchor="middle" font-weight="600" opacity="1">3.3 V or 5 V</text><rect x="626" y="150" width="28" height="56" fill="#F0EEE8" stroke="#2f3635" stroke-width="2"/><path d="M640 206 V240 M640 240 H720" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><circle cx="640" cy="240" r="4" fill="#2f3635"/><text x="726" y="245" font-size="13" fill="#2f3635" text-anchor="start" font-weight="600" opacity="1">to the pin</text><path d="M640 240 V258 M640 288 V300" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><circle cx="640" cy="258" r="4" fill="#2f3635"/><circle cx="640" cy="288" r="4" fill="#2f3635"/><path d="M640 288 L668 254" stroke="#FF6347" stroke-width="2.8" stroke-linecap="round"/><path d="M624 300 H656" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><path d="M628 306 H652 M633 312 H647" stroke="#2f3635" stroke-width="2.1" stroke-linecap="round"/><text x="668" y="172" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">10 k&#937;</text><text x="668" y="190" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">pull-up</text><text x="678" y="292" font-size="12.5" fill="#FF6347" text-anchor="start" font-weight="600" opacity="1">the button</text><text x="600" y="348" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">Or skip the resistor and use the chip's own:</text><text x="600" y="366" font-size="12.5" fill="#FF6347" text-anchor="start" font-weight="600" opacity="1">INPUT_PULLUP. Pressed then reads LOW.</text></svg>