<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><text x="30" y="30" font-size="17" fill="#2f3635" text-anchor="start" font-weight="700" opacity="1">Slide switch (SPDT) &#8212; the middle pin is the common</text><text x="830" y="30" font-size="12.5" fill="#2f3635" text-anchor="end" font-weight="400" opacity="0.6">latching: it stays where you put it</text><path d="M392 56 V300" stroke="#2f3635" stroke-width="1" opacity=".22"/><path d="M612 56 V300" stroke="#2f3635" stroke-width="1" opacity=".22"/><text x="30" y="74" font-size="11.5" fill="#2f3635" font-weight="700" letter-spacing="1.6" opacity=".55">FROM ABOVE</text><text x="420" y="74" font-size="11.5" fill="#2f3635" font-weight="700" letter-spacing="1.6" opacity=".55">THE TWO POSITIONS</text><text x="636" y="74" font-size="11.5" fill="#2f3635" font-weight="700" letter-spacing="1.6" opacity=".55">THE TWO WAYS TO USE IT</text><rect x="120" y="112" width="180" height="86" rx="4" fill="#22222A"/><rect x="132" y="124" width="52" height="62" rx="3" fill="#CBC8C0" stroke="#8E8B84"/><path d="M210 155 H268 M268 155 l-9 -5 M268 155 l-9 5" stroke="#FF6347" stroke-width="2.2" fill="none" opacity=".85"/><text x="240" y="146" font-size="11.5" fill="#FF6347" text-anchor="middle" font-weight="600" opacity="1">slides</text><rect x="143" y="198" width="14" height="34" rx="2" fill="#D9B24A" stroke="#A8862F"/><rect x="203" y="198" width="14" height="34" rx="2" fill="#D9B24A" stroke="#A8862F"/><rect x="263" y="198" width="14" height="34" rx="2" fill="#D9B24A" stroke="#A8862F"/><text x="150" y="254" font-size="15" fill="#2f3635" text-anchor="middle" font-weight="700" opacity="1">1</text><text x="210" y="254" font-size="15" fill="#FF6347" text-anchor="middle" font-weight="700" opacity="1">C</text><text x="270" y="254" font-size="15" fill="#2f3635" text-anchor="middle" font-weight="700" opacity="1">2</text><text x="210" y="282" font-size="12.5" fill="#FF6347" text-anchor="middle" font-weight="600" opacity="1">common</text><text x="210" y="306" font-size="12.5" fill="#2f3635" text-anchor="middle" font-weight="400" opacity="0.7">Throw it one way and C joins 1;</text><text x="210" y="324" font-size="12.5" fill="#2f3635" text-anchor="middle" font-weight="400" opacity="0.7">the other way and C joins 2. Never both.</text><path d="M430 142 H470" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><circle cx="474" cy="142" r="4" fill="#2f3635"/><circle cx="542" cy="122" r="4" fill="#2f3635"/><circle cx="542" cy="162" r="4" fill="#2f3635"/><path d="M542 122 H582 M542 162 H582" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><text x="464" y="132" font-size="13" fill="#FF6347" text-anchor="middle" font-weight="700" opacity="1">C</text><text x="588" y="127" font-size="13" fill="#2f3635" text-anchor="start" font-weight="700" opacity="1">1</text><text x="588" y="167" font-size="13" fill="#2f3635" text-anchor="start" font-weight="700" opacity="1">2</text><path d="M474 142 L538 122" stroke="#FF6347" stroke-width="2.8" stroke-linecap="round"/><path d="M430 238 H470" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><circle cx="474" cy="238" r="4" fill="#2f3635"/><circle cx="542" cy="218" r="4" fill="#2f3635"/><circle cx="542" cy="258" r="4" fill="#2f3635"/><path d="M542 218 H582 M542 258 H582" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><text x="464" y="228" font-size="13" fill="#FF6347" text-anchor="middle" font-weight="700" opacity="1">C</text><text x="588" y="223" font-size="13" fill="#2f3635" text-anchor="start" font-weight="700" opacity="1">1</text><text x="588" y="263" font-size="13" fill="#2f3635" text-anchor="start" font-weight="700" opacity="1">2</text><path d="M474 238 L538 258" stroke="#FF6347" stroke-width="2.8" stroke-linecap="round"/><text x="420" y="328" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.7">One pin in, two pins out.</text><text x="636" y="110" font-size="14" fill="#2f3635" text-anchor="start" font-weight="700" opacity="1">On / off</text><text x="636" y="132" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.72">Use the common and either end pin.</text><text x="636" y="150" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.72">Leave the third one empty.</text><path d="M636 178 H690 M746 178 H820" stroke="#2f3635" stroke-width="2.1" fill="none" stroke-linecap="round"/><circle cx="694" cy="178" r="4" fill="#2f3635"/><circle cx="742" cy="178" r="4" fill="#2f3635"/><path d="M694 178 L740 162" stroke="#FF6347" stroke-width="2.6" stroke-linecap="round"/><text x="636" y="232" font-size="14" fill="#2f3635" text-anchor="start" font-weight="700" opacity="1">A or B</text><text x="636" y="254" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.72">Use all three. Whatever arrives</text><text x="636" y="272" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.72">at the common leaves by one end</text><text x="636" y="290" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.72">or the other: two LEDs, two</text><text x="636" y="308" font-size="12.5" fill="#2f3635" text-anchor="start" font-weight="400" opacity="0.72">circuits, two modes.</text></svg>